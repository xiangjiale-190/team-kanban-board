<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>团队任务看板</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>📋 团队任务看板</h1>
    <button id="new-task-btn" class="btn-primary">＋ 新建任务</button>
  </header>

  <main id="board" class="board">
    <section class="kanban-column" data-column="todo">
      <h2 class="column-title">待办</h2>
      <div class="task-list"></div>
    </section>
    <section class="kanban-column" data-column="in-progress">
      <h2 class="column-title">进行中</h2>
      <div class="task-list"></div>
    </section>
    <section class="kanban-column" data-column="done">
      <h2 class="column-title">已完成</h2>
      <div class="task-list"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <!-- 徐鑫（前端B）在自己的功能分支上在此处添加：
       <script src="js/task-create.js"></script> -->
  <!-- 相嘉乐（前端C）在自己的功能分支上在此处添加：
       <script src="js/task-drag.js"></script> -->
</body>
</html>
